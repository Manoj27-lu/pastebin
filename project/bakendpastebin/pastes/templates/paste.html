<!DOCTYPE html>
<html>

<head>
    <title>Paste</title>
    <style>
        body {
            font-family: monospace;
            background-color: #f5f5f5;
            padding: 20px;
        }

        pre {
            background-color: #fff;
            border: 1px solid #ccc;
            padding: 15px;
            border-radius: 4px;
            overflow-x: auto;
        }
    </style>
</head>

<body>
    <pre>{{ content|escape }}</pre>
</body>

</html>
